<!-- Media widget; expects in `.` the widget: items[] (media items: the tile by type — media/image, media/video), layout (grid | ribbon | single). The widget is a swipe group of its own in the viewer. -->
<div class="widget media-widget">
  <ul class="gallery gallery--{{.layout}}" role="list" data-gallery>
    <!-- each:.items --><!-- include:media/{{.type}} --><!-- endeach -->
  </ul>
</div>
