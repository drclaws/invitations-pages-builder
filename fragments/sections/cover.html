<!-- Cover; expects in `.` the cover section: domId, titleId, eyebrow, event (the guest's primary event: startISO, dateText), background (an image media item or null), backgroundFocus (an enumeration: which part of the photo stays visible); from the root: coupleNames. The couple's names are the only h1 of the page. No reveal mark: the cover has an animation of its own. The photo is a background: an empty alt, the backdrop hidden from screen readers; not lazy-loaded, since it is the first screen. The backdrop condition sits inside the markup lines rather than on lines of its own: without a photo the cover renders without an empty line. After the cover comes the top bar that the cover collapses into on scroll: a one-line copy of the names and the date, hidden from screen readers, with nothing focusable in it; without the script it is not visible. -->
<section class="cover" id="{{.domId}}" aria-labelledby="{{.titleId}}" data-cover><!-- if:.background -->
  <div class="cover__backdrop" aria-hidden="true"><img class="cover__photo cover__photo--{{.backgroundFocus}}" src="{{.background.src}}" alt="" fetchpriority="high"></div><!-- endif -->
  <div class="container cover__inner">
    <!-- if:.eyebrow -->
    <p class="section__subtitle cover__eyebrow">{{.eyebrow}}</p>
    <!-- endif -->
    <h1 class="cover__title" id="{{.titleId}}">{{coupleNames}}</h1>
    <hr class="divider divider--accent cover__divider">
    <p class="cover__date"><time datetime="{{.event.startISO}}">{{.event.dateText}}</time></p>
  </div>
</section>
<div class="cover-bar" aria-hidden="true" data-cover-bar>
  <div class="container cover-bar__inner"><span class="cover-bar__title">{{coupleNames}}</span><span class="cover-bar__sep">·</span><span class="cover-bar__date">{{.event.dateText}}</span></div>
</div>
