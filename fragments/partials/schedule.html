<!-- Programme; expects in `.` a programme: items[] (items: time, title, text), nested. nested — a programme inside an event card under the programme subheading (h4): the items are h5; a widget of its own stands right under the section heading: the items are h3. The level is chosen before each: inside it `.` is an item, which has no programme flag. -->
<!-- if:.nested -->
<ol class="schedule__list" role="list">
  <!-- each:.items -->
  <li class="schedule__item">
    <!-- if:.time -->
    <span class="time-label schedule__time">{{.time}}</span>
    <!-- endif -->
    <div class="stack stack--tight schedule__body">
      <h5 class="schedule__name">{{.title}}</h5>
      <!-- if:.text -->
      <p>{{.text}}</p>
      <!-- endif -->
    </div>
  </li>
  <!-- endeach -->
</ol>
<!-- endif -->
<!-- if:!.nested -->
<ol class="schedule__list" role="list">
  <!-- each:.items -->
  <li class="schedule__item">
    <!-- if:.time -->
    <span class="time-label schedule__time">{{.time}}</span>
    <!-- endif -->
    <div class="stack stack--tight schedule__body">
      <h3 class="schedule__name">{{.title}}</h3>
      <!-- if:.text -->
      <p>{{.text}}</p>
      <!-- endif -->
    </div>
  </li>
  <!-- endeach -->
</ol>
<!-- endif -->
