<!-- Section heading (h2); expects in `.` a section: title, titleId, titleHidden. A hidden heading is not visible but stays the accessible name of the section. -->
<!-- if:!.titleHidden -->
<h2 class="section__title" id="{{.titleId}}">{{.title}}</h2>
<!-- endif -->
<!-- if:.titleHidden -->
<h2 class="section__title visually-hidden" id="{{.titleId}}">{{.title}}</h2>
<!-- endif -->
