<!-- Venue card; expects in `.` a venue: ready, name, address, description, mapLinks, hasMapLinks, photos[], directions (a media item or null), directionsCredit, compact, nested.
     compact — only the name, the address and the map buttons; nested — a venue inside an event card: the name is an h4 instead of an h3, with no border of its own.
     The map caption: the directions label, then after a space, with no separator, the credit (directionsCredit) in its own element. -->
<!-- if:.ready -->
<!-- if:.compact -->
<div class="card stack location-card location-card--compact">
  <!-- if:!.nested -->
  <h3 class="venue__name">{{.name}}</h3>
  <!-- endif -->
  <!-- if:.nested -->
  <h4 class="venue__name">{{.name}}</h4>
  <!-- endif -->
  <!-- if:.address -->
  <p class="venue__address">{{.address}}</p>
  <!-- endif -->
  <!-- include:partials/map-links -->
</div>
<!-- endif -->
<!-- if:!.compact -->
<div class="grid venue__layout location-card">
  <div class="stack venue__info">
    <!-- if:!.nested -->
    <h3 class="venue__name">{{.name}}</h3>
    <!-- endif -->
    <!-- if:.nested -->
    <h4 class="venue__name">{{.name}}</h4>
    <!-- endif -->
    <!-- if:.address -->
    <p class="venue__address">{{.address}}</p>
    <!-- endif -->
    <!-- if:.description -->
    <div class="prose venue__description">
      <p>{{.description}}</p>
    </div>
    <!-- endif -->
    <!-- include:partials/map-links -->
    <!-- if:.directions -->
    <figure class="venue__scheme">
      <!-- with:.directions --><a class="media media--scheme" href="{{.src}}" data-lightbox>
        <img src="{{.thumbSrc}}" alt="{{.alt}}" loading="lazy" decoding="async">
      </a><!-- endwith -->
      <figcaption class="gallery__caption">Схема проезда<!-- if:.directionsCredit --> <span class="venue__scheme-credit">{{.directionsCredit}}</span><!-- endif --></figcaption>
    </figure>
    <!-- endif -->
  </div>
  <!-- if:.photos -->
  <ul class="gallery gallery--ribbon venue__gallery" role="list" data-gallery>
    <!-- each:.photos --><!-- include:media/{{.type}} --><!-- endeach -->
  </ul>
  <!-- endif -->
</div>
<!-- endif -->
<!-- endif -->
<!-- if:!.ready -->
<!-- if:!.nested -->
<div class="card location-card location-card--pending venue__pending">
  <p>Подробности появятся на этой странице позже.</p>
</div>
<!-- endif -->
<!-- if:.nested -->
<div class="location-card location-card--pending venue__pending">
  <p>Подробности появятся на этой странице позже.</p>
</div>
<!-- endif -->
<!-- endif -->
