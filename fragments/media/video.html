<!-- Video tile; expects in `.` a media item: src, thumbSrc, posterSrc, label, ratio, width, height, durationText (empty when unknown). The poster with a ▶ badge (inline SVG); the video plays in the viewer. Without the script it is a link to the file, which the browser plays by itself. Before the link sits the invisible sizer .gallery__sizer: it sets the ratio of a single tile (gallery--single) without a style attribute and is not shown in the grid or the ribbon. -->
<!-- if:.width -->
<li class="gallery__item"><svg class="gallery__sizer" width="{{.width}}" height="{{.height}}" viewBox="0 0 {{.width}} {{.height}}" aria-hidden="true" focusable="false"></svg><a class="gallery__link media-tile media-tile--video" href="{{.src}}" type="video/mp4" data-lightbox data-media="video" data-media-poster="{{.posterSrc}}" data-media-ratio="{{.ratio}}" aria-label="{{.label}}"><img src="{{.thumbSrc}}" alt="" width="{{.width}}" height="{{.height}}" loading="lazy" decoding="async"><span class="media-tile__badge" aria-hidden="true"><svg class="media-tile__icon" viewBox="0 0 24 24" focusable="false"><path d="M8 5v14l11-7z"/></svg></span><!-- if:.durationText --><span class="media-tile__duration" aria-hidden="true">{{.durationText}}</span><!-- endif --></a></li>
<!-- endif -->
<!-- if:!.width -->
<li class="gallery__item"><span class="gallery__sizer gallery__sizer--default" aria-hidden="true"></span><a class="gallery__link media-tile media-tile--video" href="{{.src}}" type="video/mp4" data-lightbox data-media="video" data-media-poster="{{.posterSrc}}" aria-label="{{.label}}"><img src="{{.thumbSrc}}" alt="" loading="lazy" decoding="async"><span class="media-tile__badge" aria-hidden="true"><svg class="media-tile__icon" viewBox="0 0 24 24" focusable="false"><path d="M8 5v14l11-7z"/></svg></span><!-- if:.durationText --><span class="media-tile__duration" aria-hidden="true">{{.durationText}}</span><!-- endif --></a></li>
<!-- endif -->
