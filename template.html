<!doctype html>
<html lang="ru" class="invitation">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="{{themeColor}}">
  <meta name="text-scale" content="scale">
  <meta name="referrer" content="no-referrer">
  <title>Приглашение · {{coupleNames}}</title><!-- if:linkDescription -->
  <meta name="description" content="{{linkDescription}}"><!-- endif -->
  <meta property="og:title" content="Приглашение · {{coupleNames}}"><!-- if:linkDescription -->
  <meta property="og:description" content="{{linkDescription}}"><!-- endif -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU"><!-- if:siteName -->
  <meta property="og:site_name" content="{{siteName}}"><!-- endif -->
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:image:type" content="{{ogImageType}}">
  <meta property="og:image:width" content="{{ogImageWidth}}">
  <meta property="og:image:height" content="{{ogImageHeight}}">
  <meta property="og:image:alt" content="Приглашение · {{coupleNames}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{faviconPath}}" type="{{faviconType}}">
  <link rel="stylesheet" href="{{assetsPath}}/app.css">
  <script src="{{assetsPath}}/app.js" defer></script>
</head>
<body>

<!-- The page frame. partials/sections renders the sections in their site.json
     order: each with the fragment of its type (sections/cover,
     sections/custom), widgets with widgets/<type>, tiles with media/<type>.
     The section and widget markup lives in fragments/; here are only <head>
     and <main>.
     theme-color is the colour of the collapsed bar: the build fills it in
     from the --color-cover-veil token (app.css); the invitation class on
     <html> paints the page canvas in the same colour (app.css, section 3).
     The template has no colours of its own.
     The title and the link preview are the same for every guest: the
     title "Invitation · <the couple's names>" (in the page language) goes
     into <title>, og:title and og:image:alt; the description
     (linkDescription) is
     linkPreview.description from site.json in its general form, with no
     guest data; og:site_name only when the build has a site name
     (SITE_NAME). Every link is a path from the site root under --base-path:
     the styles, the script, the icon and the preview image live in
     assetsPath (<base-path>/assets); the build does not know the site
     address, so there is no og:url.
     The conditions sit inside the markup lines: a missing field leaves no
     empty line. -->
<main class="page">
<!-- include:partials/sections -->
</main>

</body>
</html>
